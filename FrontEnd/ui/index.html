<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mango — Voice Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="canvas">
    
    <!-- AppLlama-inspired minimal floating card -->
    <div class="card">
      
      <!-- Top Bar: Brand & Google OAuth with Calendar/Gmail permissions -->
      <div class="card-header">
        <div class="brand">
          <div class="brand-glyph">
            <span class="glyph-dot"></span>
          </div>
          <div class="brand-info">
            <span class="brand-name">Mango</span>
            <span class="brand-tag">Voice Agent</span>
          </div>
        </div>

        <div class="auth-wrap">
          <!-- Google Sign In Button -->
          <button id="connectGoogleBtn" type="button" class="pill-btn-google">
            <svg class="google-icon" viewBox="0 0 24 24" width="14" height="14">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span id="googleBtnLabel">Sign in</span>
          </button>
          
          <!-- Signed in profile pill -->
          <div id="userProfile" class="user-pill" style="display: none;">
            <img id="userAvatar" src="" alt="User" class="user-avatar">
            <span id="userName" class="user-name"></span>
            <button id="signOutBtn" type="button" class="btn-signout" title="Sign out">&times;</button>
          </div>
        </div>
      </div>

      <!-- Agent Direct Number -->
      <div class="field-box">
        <span class="field-label">Mango Line</span>
        <div class="agent-row">
          <span class="agent-number" id="agentNumberDisplay">+14849622356</span>
          <div class="pill-actions">
            <a href="tel:+14849622356" class="pill-btn">Call</a>
            <button id="copyBtn" type="button" class="pill-btn">
              <span id="copyBtnText">Copy</span>
            </button>
          </div>
        </div>
      </div>

      <!-- User Typeable Phone Number -->
      <div class="field-box">
        <label for="userPhoneInput" class="field-label">Your Phone Number</label>
        <form id="callForm" class="input-form">
          <div class="input-pill">
            <input 
              type="tel" 
              id="userPhoneInput" 
              class="phone-input" 
              placeholder="+1 (555) 000-0000" 
              autocomplete="tel"
              required
            >
            <button type="submit" id="callSubmitBtn" class="pill-cta">
              <span id="ctaText">Call Me</span>
            </button>
          </div>
        </form>
      </div>

      <div id="calendarAccessPanel" class="field-box" hidden>
        <label for="calendarAccessCode" class="field-label">Private calendar access code</label>
        <form id="calendarAccessForm" class="input-form">
          <div class="input-pill">
            <input id="calendarAccessCode" class="phone-input" type="password" inputmode="numeric"
                   pattern="[0-9]{8,12}" minlength="8" maxlength="12" autocomplete="new-password"
                   placeholder="8–12 digits" required aria-describedby="calendarAccessHelp">
            <button class="pill-cta" type="submit">Save code</button>
          </div>
        </form>
        <p id="calendarAccessHelp">Mango asks for this code before reading your calendar over the phone.</p>
      </div>

      <!-- Minimal Status Feedback -->
      <div id="statusToast" class="status-toast" style="display: none;">
        <span class="status-dot"></span>
        <span id="statusMessage"></span>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
